name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Descomprimir el proyecto si subiste el zip
        run: |
          if [ ! -f build.gradle ]; then unzip -q trixsafio-menus.zip; fi

      - name: Compilar
        run: |
          if [ -d trixsafio-menus ]; then cd trixsafio-menus; fi
          gradle build --no-daemon

      - name: Dejar el jar listo
        run: |
          mkdir -p out
          find . -path ./out -prune -o -name '*.jar' -path '*build/libs*' ! -name '*-sources.jar' -print -exec cp {} out/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: trixsafio-menus
          path: out/*.jar

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última compilación
          files: out/*.jar
          
